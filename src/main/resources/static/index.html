<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransferKolik | Player Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 💡 DAHA BASTIRILMIŞ/SOYLU RENK PALETİ + AÇIK/KOYU TEMA ALTYAPISI.
               --fg-rgb: metin/kenarlık rengi (koyu temalarda açık, açık temada koyu).
               --surface-strong-rgb: dropdown/panel gibi dolu yüzeylerin rengi (tersi yönde).
               Bu iki değişken sayesinde onlarca rgba(...) kuralı otomatik olarak
               doğru kontrastta kalıyor, tema başına ayrı ayrı tanımlamaya gerek kalmıyor. */
            --primary-green: #3e5f47;
            --dark-green: #141d16;
            --light-green: #8fae98;
            --accent-gold: #c9a961;
            --bg-gradient: linear-gradient(180deg, #14190f 0%, #1c2318 100%);
            --light-green-rgb: 143, 174, 152;
            --dark-green-rgb: 20, 29, 22;
            --primary-green-rgb: 62, 95, 71;
            --fg-rgb: 242, 240, 236;
            --surface-strong-rgb: 20, 23, 15;
        }

        /* 💡 TEMALAR — aynı mekanizma, sadece renk tonları daha bastırılmış */
        body.theme-sunset {
            --primary-green: #9c5a3f;
            --dark-green: #201009;
            --light-green: #cf9a76;
            --accent-gold: #dcb373;
            --bg-gradient: linear-gradient(180deg, #241209 0%, #2e180d 100%);
            --light-green-rgb: 207, 154, 118;
            --dark-green-rgb: 32, 16, 9;
            --primary-green-rgb: 156, 90, 63;
            --fg-rgb: 242, 240, 236;
            --surface-strong-rgb: 32, 16, 9;
        }

        body.theme-night {
            --primary-green: #38416b;
            --dark-green: #0c0e18;
            --light-green: #8b98cf;
            --accent-gold: #a3b6e6;
            --bg-gradient: linear-gradient(180deg, #0e111c 0%, #151a2a 100%);
            --light-green-rgb: 139, 152, 207;
            --dark-green-rgb: 12, 14, 24;
            --primary-green-rgb: 56, 65, 107;
            --fg-rgb: 242, 240, 236;
            --surface-strong-rgb: 12, 14, 24;
        }

        /* 💡 YENİ: AÇIK TEMA — aynı marka renkleri (biraz daha koyu tonlarda, beyaz
           zeminde okunabilir olsun diye), ama arka plan ve metin tamamen ters
           çevrilmiş. --fg-rgb ve --surface-strong-rgb sayesinde stil sayfasındaki
           onlarca kural otomatik olarak doğru kontrasta geçiyor. */
        body.theme-light {
            --primary-green: #3e5f47;
            --dark-green: #2a4030;
            --light-green: #5f8a6c;
            --accent-gold: #9c7a35;
            --bg-gradient: linear-gradient(180deg, #faf9f6 0%, #f1efe9 100%);
            --light-green-rgb: 95, 138, 108;
            --dark-green-rgb: 42, 64, 48;
            --primary-green-rgb: 62, 95, 71;
            --fg-rgb: 26, 28, 24;
            --surface-strong-rgb: 255, 255, 255;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: rgb(var(--fg-rgb));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
            transition: background 0.6s ease;
            font-weight: 400;
            letter-spacing: 0.1px;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 900px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(var(--light-green-rgb), 0.06) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
            transition: background 0.6s ease;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            background: rgba(var(--fg-rgb), 0.025);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(var(--fg-rgb), 0.09);
            border-radius: 10px;
            padding: 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            position: relative;
            z-index: 1;
            transition: box-shadow 0.6s ease;
        }

        .top-toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(var(--fg-rgb), 0.08);
            flex-wrap: wrap;
        }

        .toolbar-left-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            margin-right: auto;
        }

        .theme-switcher {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* 💡 Ses ve Paylaş — ana modlardan daha az kullanıldığı için sade,
           ikon-sadece küçük butonlar olarak tema anahtarının yanında duruyor */
        .icon-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(var(--fg-rgb), 0.2);
            background: transparent;
            color: rgba(var(--fg-rgb), 0.75);
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            border-color: rgba(var(--fg-rgb), 0.45);
            color: rgb(var(--fg-rgb));
        }

        .icon-btn.muted {
            opacity: 0.4;
        }

        .theme-label {
            font-size: 0.68rem;
            color: rgba(var(--fg-rgb), 0.4);
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-right: 4px;
        }

        .theme-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid rgba(var(--fg-rgb), 0.25);
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .theme-btn:hover {
            transform: scale(1.15);
        }

        .theme-btn.active {
            border-color: #ffffff;
            box-shadow: 0 0 0 1px rgba(var(--fg-rgb), 0.4);
        }

        .theme-btn[data-theme="green"] {
            background: linear-gradient(135deg, #8fae98, #141d16);
        }

        .theme-btn[data-theme="sunset"] {
            background: linear-gradient(135deg, #cf9a76, #201009);
        }

        .theme-btn[data-theme="night"] {
            background: linear-gradient(135deg, #8b98cf, #0c0e18);
        }

        .theme-btn[data-theme="light"] {
            background: linear-gradient(135deg, #faf9f6, #5f8a6c);
            border-color: rgba(0, 0, 0, 0.2);
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 3px;
            border: 1px solid rgba(var(--fg-rgb), 0.16);
            background: transparent;
            color: rgba(var(--fg-rgb), 0.75);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .toolbar-btn:hover {
            border-color: rgba(var(--fg-rgb), 0.4);
            color: rgb(var(--fg-rgb));
        }

        .toolbar-btn.active {
            background: rgba(var(--light-green-rgb), 0.14);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .player-mode-card {
            text-align: center;
            max-width: 420px;
            margin: 0 auto;
        }

        .player-mode-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid rgba(var(--light-green-rgb), 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            color: var(--accent-gold);
        }

        .player-mode-avatar svg {
            width: 26px;
            height: 26px;
        }

        .player-mode-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: rgba(var(--fg-rgb), 0.75);
            margin-bottom: 20px;
            letter-spacing: 0.2px;
        }

        .player-mode-clubs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .player-mode-club {
            background: rgba(var(--fg-rgb), 0.025);
            border: 1px solid rgba(var(--light-green-rgb), 0.3);
            border-radius: 3px;
            padding: 11px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            color: rgb(var(--fg-rgb));
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .player-mode-answer {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(var(--fg-rgb), 0.3);
            margin-bottom: 8px;
        }

        .player-mode-answer.revealed {
            color: var(--accent-gold);
            letter-spacing: 0.4px;
            text-transform: none;
        }

        .player-mode-position {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: rgba(var(--fg-rgb), 0.35);
            margin-bottom: 12px;
        }

        .player-mode-position.revealed {
            color: var(--light-green);
        }

        .player-mode-answer.masked-revealed {
            color: var(--light-green);
            letter-spacing: 1px;
            text-transform: none;
        }

        /* 🎯 Adam asmaca tarzı yazarak tahmin kutusu */
        .player-mode-guess-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .player-mode-guess-row input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 3px;
            border: 1px solid rgba(var(--fg-rgb), 0.18);
            background: rgba(var(--fg-rgb), 0.02);
            color: rgb(var(--fg-rgb));
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .player-mode-guess-row input:focus {
            border-color: var(--accent-gold);
        }

        .player-mode-guess-row input.correct {
            border-color: var(--light-green);
        }

        .guess-check {
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--light-green);
            background: rgba(var(--light-green-rgb), 0.15);
            border: 1px solid rgba(var(--light-green-rgb), 0.5);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1.1rem;
            flex-shrink: 0;
            animation: guessCheckPop 0.4s ease;
        }

        @keyframes guessCheckPop {
            0% { transform: scale(0.4); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ⚽ Doğru tahmin animasyonu — top ekranın solundan sağına dönerek kayıyor */
        .player-mode-celebration-wrap {
            position: relative;
            height: 30px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .player-mode-celebration {
            position: absolute;
            top: 0;
            left: -10%;
            font-size: 1.7rem;
            opacity: 0;
        }

        .player-mode-celebration.play {
            animation: ballRoll 1.1s ease-in-out forwards;
        }

        @keyframes ballRoll {
            0% { left: -10%; transform: rotate(0deg); opacity: 1; }
            100% { left: 95%; transform: rotate(720deg); opacity: 1; }
        }

        .player-mode-hint-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .player-mode-hint-row button {
            flex: 1 1 30%;
            min-width: 100px;
            padding: 12px 10px;
            font-size: 0.68rem;
            white-space: normal;
        }

        .toolbar-btn.muted {
            opacity: 0.4;
            background: transparent;
            border-color: rgba(var(--fg-rgb), 0.12);
        }

        .year-filter-panel {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: rgb(var(--surface-strong-rgb));
            border: 1px solid rgba(var(--light-green-rgb), 0.35);
            border-radius: 4px;
            padding: 14px;
            gap: 8px;
            flex-direction: column;
            z-index: 60;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
            min-width: 220px;
        }

        /* 💡 Bu panel tam solda (tema anahtarının yanında) durduğu için, diğer
           panellerin aksine sağa doğru açılıyor — yoksa ekran dışına taşıyordu. */
        #utilityMenuPanel {
            left: 0;
            right: auto;
        }

        .year-filter-panel.open {
            display: flex;
        }

        .year-filter-panel input,
        .year-filter-panel select {
            padding: 9px 10px;
            border-radius: 3px;
            border: 1px solid rgba(var(--fg-rgb), 0.15);
            background: rgba(var(--fg-rgb), 0.03);
            color: rgb(var(--fg-rgb));
            font-size: 0.85rem;
        }

        .year-filter-panel input[type="number"]::-webkit-inner-spin-button,
        .year-filter-panel input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .year-filter-panel input[type="number"] {
            -moz-appearance: textfield;
        }

        .year-filter-panel .yf-actions {
            display: flex;
            gap: 8px;
        }

        .year-filter-panel .yf-actions button {
            flex: 1;
            padding: 9px;
            border-radius: 3px;
            border: 1px solid transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        #yearFilterApplyBtn {
            background: var(--accent-gold);
            color: rgb(var(--surface-strong-rgb));
        }

        #yearFilterClearBtn {
            background: transparent;
            border-color: rgba(var(--fg-rgb), 0.2);
            color: rgba(var(--fg-rgb), 0.7);
        }

        .level-option-btn {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            width: 100%;
            padding: 10px 12px;
            border-radius: 3px;
            border: 1px solid rgba(var(--fg-rgb), 0.14);
            background: transparent;
            color: rgba(var(--fg-rgb), 0.75);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
            text-align: left;
            transition: all 0.2s ease;
        }

        .level-option-btn:hover {
            border-color: rgba(var(--light-green-rgb), 0.5);
        }

        .level-option-btn.active {
            background: rgba(var(--light-green-rgb), 0.12);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .level-option-btn .level-desc {
            font-size: 0.7rem;
            font-weight: 400;
            color: rgba(var(--fg-rgb), 0.5);
        }

        .level-option-btn + .level-option-btn {
            margin-top: 8px;
        }

        .toolbar-wrapper {
            position: relative;
        }

        .site-header {
            width: calc(100% + 40px);
            margin: -40px -20px 30px -20px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(var(--fg-rgb), 0.07);
            position: sticky;
            top: 0;
            z-index: 300;
        }

        .site-header-inner {
            max-width: 1150px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
        }

        .logo-mark {
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
        }

        .logo-badge {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            background: transparent;
            border: 1px solid rgba(var(--light-green-rgb), 0.55);
            transition: border-color 0.6s ease;
        }

        .logo-text {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgb(var(--fg-rgb));
        }

        .logo-text-accent {
            color: #c9a961;
            font-weight: 700;
        }

        .dedication {
            text-align: center;
            font-size: 0.72rem;
            color: rgba(var(--fg-rgb), 0.4);
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            color: rgba(var(--fg-rgb), 0.5);
            font-size: 0.85rem;
            font-weight: 400;
            margin-bottom: 30px;
            letter-spacing: 0.2px;
            transition: color 0.6s ease;
        }

        .top-loader {
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(var(--fg-rgb), 0.03);
            border: 1px solid rgba(var(--light-green-rgb), 0.35);
            border-radius: 4px;
            padding: 10px 22px;
            margin: 0 auto 20px auto;
            max-width: 440px;
            gap: 15px;
        }

        .loader-track {
            position: relative;
            width: 190px;
            height: 2px;
            background: rgba(var(--fg-rgb), 0.1);
            overflow: hidden;
        }

        .loader-track::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(var(--light-green-rgb), 0.9), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .rolling-ball {
            display: none;
        }

        .top-loader span {
            font-size: 0.72rem;
            color: rgba(var(--fg-rgb), 0.6);
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .search-card {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 16px;
            background: rgba(var(--fg-rgb), 0.02);
            padding: 26px;
            border-radius: 4px;
            border: 1px solid rgba(var(--fg-rgb), 0.1);
            margin-bottom: 34px;
            overflow: visible;
            transition: border-color 0.6s ease;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .input-group label {
            font-size: 0.68rem;
            color: rgba(var(--fg-rgb), 0.5);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.6s ease;
        }

        .input-group input {
            padding: 13px 16px;
            border-radius: 3px;
            border: 1px solid rgba(var(--fg-rgb), 0.18);
            background: rgba(var(--fg-rgb), 0.02);
            color: rgb(var(--fg-rgb));
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease, border-color 0.6s ease;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
        }

        .input-group input::placeholder {
            color: rgba(var(--fg-rgb), 0.3);
            font-weight: 400;
        }

        .input-group input:focus {
            border-color: var(--accent-gold);
            background: rgba(var(--fg-rgb), 0.035);
        }

        .autocomplete-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 4px;
            background: rgb(var(--surface-strong-rgb));
            border: 1px solid rgba(var(--light-green-rgb), 0.35);
            border-radius: 4px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
        }

        .autocomplete-item {
            padding: 11px 16px;
            color: rgba(var(--fg-rgb), 0.8);
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(var(--fg-rgb), 0.05);
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover,
        .autocomplete-item.active {
            background: rgba(var(--light-green-rgb), 0.12);
            color: rgb(var(--fg-rgb));
        }

        .btn-search {
            align-self: flex-end;
            padding: 13px 30px;
            background: rgb(var(--fg-rgb));
            color: rgb(var(--surface-strong-rgb));
            border: none;
            border-radius: 3px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-search:hover {
            background: var(--accent-gold);
            transform: translateY(-1px);
        }

        .btn-search:active {
            transform: translateY(0);
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 4px;
            border: 1px solid rgba(var(--fg-rgb), 0.09);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0, 0, 0, 0.15);
            text-align: left;
        }

        th {
            background: transparent;
            color: rgba(var(--fg-rgb), 0.45);
            padding: 14px 18px;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(var(--fg-rgb), 0.14);
        }

        td {
            padding: 15px 18px;
            border-bottom: 1px solid rgba(var(--fg-rgb), 0.05);
            font-size: 0.9rem;
            color: rgba(var(--fg-rgb), 0.85);
        }

        tbody tr:hover {
            background: rgba(var(--fg-rgb), 0.025);
        }

        .badge-id {
            background: transparent;
            border: 1px solid rgba(var(--fg-rgb), 0.15);

    async function loadSuggestions() {
        try {
            const response = await fetch('/suggestions');
            if (response.ok) {
                allSuggestions = await response.json();

            console.log("Öneriler yüklenirken pas geçildi.");

    // 💡 Türkçe karakterleri (ş→s, ç→c, ğ→g, ü→u, ö→o, ı→i) düz harfe çeviriyoruz —
    // veritabanındaki kulüp isimleri genelde Türkçe karaktersiz kayıtlı (örn.
    // "Besiktas", "Fenerbahce"), bu dönüşüm olmadan "Beşiktaş" yazınca öneri
    // bulunamıyordu. Backend'deki toStandardSearch() ile aynı mantık.
    function normalize(str) {
        return str
            .toLocaleLowerCase('tr-TR')
            .replace(/ı/g, 'i')
            .replace(/ğ/g, 'g')
            .replace(/ü/g, 'u')
            .replace(/ş/g, 's')
            .replace(/ö/g, 'o')
            .replace(/ç/g, 'c')
            .trim();
    }

    // 💡 BİLDİRİM (TOAST)
    function showToast(message) {
        let toast = document.getElementById('appToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'appToast';
            document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toast._hideTimer);
        toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // 💡 SES EFEKTİ — harici ses dosyasına gerek yok, Web Audio API ile anlık üretiliyor.
    // Sadece kullanıcının kendi tıklamasıyla tetiklendiği için tarayıcıların otomatik
    // ses engelleme politikalarına takılmıyor.
    // 🎉 Doğru tahmin edince çalan kısa, neşeli "başarı" sesi — yükselen 3 nota.
    // Harici dosyaya gerek yok, mevcut düdük sesiyle aynı yöntemle (Web Audio API)
    // anlık üretiliyor, Ses ayarına (soundOn) uyuyor.
    function playCorrectSound() {
        if (!soundOn) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99]; // C5, E5, G5 — neşeli majör arpej

            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const startTime = now + i * 0.1;

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, startTime);

                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.22, startTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.28);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(startTime);
                osc.stop(startTime + 0.3);
            });
        } catch (e) {
            console.log("Ses çalınamadı:", e);
        }
    }

    function playSearchSound() {
        if (!soundOn) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;

            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const whistleGain = ctx.createGain();

            osc1.type = 'square';
            osc2.type = 'square';
            osc1.frequency.setValueAtTime(1200, now);
            osc2.frequency.setValueAtTime(1215, now);

            whistleGain.gain.setValueAtTime(0, now);
            whistleGain.gain.linearRampToValueAtTime(0.10, now + 0.02);
            whistleGain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);

            osc1.connect(whistleGain);
            osc2.connect(whistleGain);
            whistleGain.connect(ctx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.28);
            osc2.stop(now + 0.28);

            const popOsc = ctx.createOscillator();
            const popGain = ctx.createGain();

            popOsc.type = 'sine';
            popOsc.frequency.setValueAtTime(180, now + 0.24);
            popOsc.frequency.exponentialRampToValueAtTime(55, now + 0.36);

            popGain.gain.setValueAtTime(0.22, now + 0.24);
            popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

            popOsc.connect(popGain);
            popGain.connect(ctx.destination);

            popOsc.start(now + 0.24);
            popOsc.stop(now + 0.4);
        } catch (e) {
            console.log("Ses çalınamadı:", e);
        }
    }

        return name.split(' ').map(word => {
            return word.split('').map(ch => {
                if (/[a-zA-ZçÇğĞıİöÖşŞüÜ]/.test(ch)) return '_';
                return ch;
            }).join(' ');
        }).join('\u00A0\u00A0\u00A0'); // kırılmaz boşluk — tarayıcı bunu tek boşluğa sıkıştırmıyor
    }

    function normalizeGuess(str) {
        return normalize(str.replace(/\s+/g, ' ').trim());
    }

    async function startPlayerMode() {
        const resultsTable = document.getElementById("resultsTable");
        const topLoader = document.getElementById("topLoader");
        topLoader.style.display = "flex";
        playSearchSound();

        const maxAttempts = 8;
        let found = null;

        for (let i = 0; i < maxAttempts; i++) {
            const shuffled = [...luckyClubs].sort(() => Math.random() - 0.5);
            const pick = shuffled.slice(0, 2);

            try {
                const res = await fetch(`/playerMode?clubs=${encodeURIComponent(pick.join(','))}`);
                if (res.ok) {
                    found = await res.json();
                    break;
                }
            } catch (e) {
                // sessizce bir sonraki denemeye geç
            }
        }

        topLoader.style.display = "none";
        currentPlayers = [];

        let bodyHtml;
        if (!found) {
            bodyHtml = `<div class="player-mode-title">😅 Uygun bir eşleşme bulunamadı.</div>`;
        } else {
            const cleanFullName = found.playerName.replace(/\s*\(\d+\)\s*/g, "").trim();
            const safeName = cleanFullName.replace(/"/g, "&quot;");
            const safeMasked = maskNamePlayerModeHint(cleanFullName).replace(/"/g, "&quot;");
            const safePosition = (found.position && found.position.trim())
                ? found.position.trim().replace(/"/g, "&quot;")
                : "Bilinmiyor";

            const clubListHtml = found.clubs.map(c => {
                const seasonBadge = (c.season && c.season !== '-')
                    ? `<span class="badge-season">${c.season}</span>`
                    : '';
                return `<div class="player-mode-club">${c.club} ${seasonBadge}</div>`;
            }).join('');

            const avatarHtml = `
                <div class="player-mode-avatar">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.4"/>
                        <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                </div>
            `;

            const dashPattern = nameToDashPattern(cleanFullName);

            bodyHtml = `
                ${avatarHtml}
                <div class="player-mode-title">🎮 Her iki takımda da oynamış reis kimdir?</div>
                <div class="player-mode-clubs">${clubListHtml}</div>
                <div class="player-mode-position" id="playerModePosition" data-real="${safePosition}">Mevki: ???</div>
                <div class="player-mode-answer" id="playerModeAnswer" data-real="${safeName}" data-masked="${safeMasked}">${dashPattern}</div>
                <div class="player-mode-guess-row">
                    <input type="text" id="playerModeGuessInput" placeholder="Tahminini yaz..." autocomplete="off">
                    <span id="playerModeGuessCheck" class="guess-check">✔️</span>
                </div>
                <div class="player-mode-celebration-wrap">
                    <div id="playerModeCelebration" class="player-mode-celebration">⚽</div>
                </div>
                <div class="player-mode-hint-row">
                    <button id="revealPositionBtn" class="toolbar-btn">🧭 Mevkisini Göster</button>
                    <button id="revealMaskedBtn" class="toolbar-btn">🎭 Maskeli Göster</button>
                    <button id="revealPlayerModeBtn" class="btn-search">Oyuncuyu Göster</button>
                </div>
            `;
        }

        resultsTable.innerHTML = `
            <tr>
                <td colspan="6" style="padding: 24px;">
                    <div class="player-mode-card">
                        ${bodyHtml}
                        <div class="player-mode-hint-row">
                            <button id="newPlayerModeBtn" class="toolbar-btn">🔄 Yeni Oyuncu</button>
                        </div>
                    </div>
                </td>
            </tr>
        `;

        const revealPositionBtn = document.getElementById('revealPositionBtn');
        if (revealPositionBtn) {
            revealPositionBtn.addEventListener('click', () => {
                const positionEl = document.getElementById('playerModePosition');
                positionEl.textContent = 'Mevki: ' + positionEl.dataset.real;
                positionEl.classList.add('revealed');
            });
        }

        const revealMaskedBtn = document.getElementById('revealMaskedBtn');
        if (revealMaskedBtn) {
            revealMaskedBtn.addEventListener('click', () => {
                const answerEl = document.getElementById('playerModeAnswer');
                if (!answerEl.classList.contains('revealed')) {
                    answerEl.textContent = answerEl.dataset.masked;
                    answerEl.classList.add('masked-revealed');
                }
            });
        }

        const revealBtn = document.getElementById('revealPlayerModeBtn');
        if (revealBtn) {
            revealBtn.addEventListener('click', () => {
                const answerEl = document.getElementById('playerModeAnswer');
                answerEl.textContent = answerEl.dataset.real;
                answerEl.classList.add('revealed');
                answerEl.classList.remove('masked-revealed');

                const guessInputEl = document.getElementById('playerModeGuessInput');
                if (guessInputEl) guessInputEl.disabled = true;
            });
        }

        // 🎯 Yazarak oynamak isteyenler için: doğru tahmin edince otomatik tik
        // atıp cevabı açıyor. Diğer butonlara (Mevki/Maskeli/Göster) hiç dokunmuyor.
        const guessInput = document.getElementById('playerModeGuessInput');
        const guessCheck = document.getElementById('playerModeGuessCheck');
        if (guessInput && guessCheck) {
            guessInput.addEventListener('input', () => {
                const answerEl = document.getElementById('playerModeAnswer');
                const real = answerEl.dataset.real;
                const realWords = real.trim().split(/\s+/);
                const surname = realWords[realWords.length - 1];

                const guessNormalized = normalizeGuess(guessInput.value);
                const realNormalized = normalizeGuess(real);
                const surnameNormalized = normalizeGuess(surname);

                // 💡 Tam ad-soyad çok zor olabileceği için sadece SOYADI doğru
                // yazmak da yeterli kabul ediliyor.
                if (guessNormalized.length > 0 && (guessNormalized === realNormalized || guessNormalized === surnameNormalized)) {
                    guessCheck.style.display = 'flex';
                    guessInput.classList.add('correct');
                    answerEl.textContent = real;
                    answerEl.classList.add('revealed');
                    answerEl.classList.remove('masked-revealed');
                    guessInput.disabled = true;
                    playCorrectSound();

                    const celebration = document.getElementById('playerModeCelebration');
                    if (celebration) celebration.classList.add('play');
                } else {
                    guessCheck.style.display = 'none';
                    guessInput.classList.remove('correct');
                }
            });
        }

        document.getElementById('newPlayerModeBtn').addEventListener('click', startPlayerMode);
    }

    // 💡 Oyuncu Modu'ndan çıkma mantığı — tek bir yerden yönetiliyor, hem karttaki
    // "Normal Aramaya Dön" butonu hem üstteki "Ana Menü" butonu hem de "Oyuncu Modu"
    // butonuna tekrar basma, hepsi bu fonksiyonu çağırıyor. Zaten normal moddaysa
    // (playerModeActive false ise) sessizce hiçbir şey yapmıyor.
    function exitPlayerMode() {
        if (!playerModeActive) return;

        playerModeActive = false;
        document.getElementById('playerModeBtn').classList.remove('active');
        document.getElementById('homeMenuBtn').style.display = 'none';
        document.querySelector('.search-card').style.display = '';
        document.getElementById('luckyModeBtn').style.display = '';
        document.getElementById('hunterModeWrapper').style.display = '';
        document.getElementById('yearFilterWrapper').style.display = '';
        document.getElementById('resultsTableHead').style.display = '';
        searchPlayers();
    }

    function setupHomeMenuButton() {
        document.getElementById('homeMenuBtn').addEventListener('click', exitPlayerMode);
    }

    function setupPlayerMode() {
        const btn = document.getElementById('playerModeBtn');
        const searchCard = document.querySelector('.search-card');
        const luckyBtn = document.getElementById('luckyModeBtn');
        const hunterWrapper = document.getElementById('hunterModeWrapper');
        const yearWrapper = document.getElementById('yearFilterWrapper');
        const tableHead = document.getElementById('resultsTableHead');

        btn.addEventListener('click', () => {
            if (playerModeActive) {
                exitPlayerMode();
                return;
            }

            playerModeActive = true;
            btn.classList.add('active');
            document.getElementById('homeMenuBtn').style.display = '';
            searchCard.style.display = 'none';
            luckyBtn.style.display = 'none';
            hunterWrapper.style.display = 'none';
            yearWrapper.style.display = 'none';
            tableHead.style.display = 'none';
            startPlayerMode();
        });
    }

    function setupAutocomplete(inputId, dropdownId) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        let activeIndex = -1;

        function closeDropdown() {
            dropdown.style.display = "none";
            dropdown.innerHTML = "";
            activeIndex = -1;
        }

        function renderMatches() {
            const query = input.value.trim();
            if (!query) {
                closeDropdown();
                return;
            }

            const normalizedQuery = normalize(query);
            const matches = allSuggestions
                .filter(s => normalize(s).includes(normalizedQuery))
                .slice(0, 8);

            dropdown.innerHTML = "";
            activeIndex = -1;

            if (matches.length === 0) {
                closeDropdown();
                return;
            }

            matches.forEach(match => {
                const item = document.createElement("div");
                item.className = "autocomplete-item";
                item.textContent = match;

                item.addEventListener("mousedown", (e) => {
                    e.preventDefault();
                    input.value = match;
                    closeDropdown();
                });

                dropdown.appendChild(item);
            });

            dropdown.style.display = "block";
        }

        input.addEventListener("input", renderMatches);
        input.addEventListener("focus", renderMatches);

        input.addEventListener("blur", () => {
            setTimeout(closeDropdown, 150);
        });

        input.addEventListener("keydown", (e) => {
            const items = dropdown.querySelectorAll(".autocomplete-item");
            if (items.length === 0) return;

            if (e.key === "ArrowDown") {
                e.preventDefault();
                activeIndex = Math.min(activeIndex + 1, items.length - 1);
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                activeIndex = Math.max(activeIndex - 1, 0);
            } else if (e.key === "Enter") {
                if (activeIndex >= 0 && items[activeIndex]) {
                    e.preventDefault();
                    input.value = items[activeIndex].textContent;
                    closeDropdown();
                }
                return;
            } else if (e.key === "Escape") {
                closeDropdown();
                return;
            } else {
                return;
            }

            items.forEach((item, idx) => {
                item.classList.toggle("active", idx === activeIndex);
            });
            items[activeIndex].scrollIntoView({ block: "nearest" });
        });
    }

    function setupThemeSwitcher() {
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.body.classList.remove('theme-sunset', 'theme-night', 'theme-light');
                const theme = btn.dataset.theme;
                if (theme === 'sunset') document.body.classList.add('theme-sunset');
                if (theme === 'night') document.body.classList.add('theme-night');
                if (theme === 'light') document.body.classList.add('theme-light');

                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    }

    function maskNameEasy(name) {
        return name.split(' ').map(word => {
            const letters = word.split('');
            const len = letters.length;

            if (len <= 3) {
                const midIdx = Math.floor(len / 2);
                return letters.map((ch, idx) => {
                    if (idx === midIdx && /[a-zA-ZçÇğĞıİöÖşŞüÜ]/.test(ch)) {
                        return '✦';
                    }
                    return ch;
                }).join('');
            }

            return letters.map((ch, idx) => {
                if (idx === 0 || idx === len - 1) return ch;
                if (/[a-zA-ZçÇğĞıİöÖşŞüÜ]/.test(ch) && Math.random() < 0.35) {
                    return '✦';
                }
                return ch;
            }).join('');
        }).join(' ');
    }

    // 🎮 Oyuncu Modu'nun "Maskeli Göster" ipucuna özel, daha zorlu maskeleme —
    // her kelimede (ad/soyad) SADECE ilk ve son harf açık, aradaki HER harf
    // (rastgelelik olmadan, tamamen) maskeli. Ana Maskeleme özelliğine (Çaylak/Usta)
    // hiç dokunmuyor, ayrı bir fonksiyon.
    function maskNamePlayerModeHint(name) {
        return name.split(' ').map(word => {
            const letters = word.split('');
            const len = letters.length;

            // 1-2 harflik çok kısa kelimelerde ilk=son harf çakışacağından
            // olduğu gibi bırakıyoruz, aksi halde kelime tamamen kayboluyor.
            if (len <= 2) {
                return word;
            }

            return letters.map((ch, idx) => {
                if (idx === 0 || idx === len - 1) return ch;
                if (/[a-zA-ZçÇğĞıİöÖşŞüÜ]/.test(ch)) {
                    return '✦';
                }
                return ch;
            }).join('');
        }).join(' ');
    }

    function maskName(name) {
        if (hunterLevel === 'hard') {
            return name.split(' ').map(word => {
                return word.split('').map((ch, idx) => {
                    if (idx === 0) return ch;
                    if (/[a-zA-ZçÇğĞıİöÖşŞüÜ]/.test(ch)) {
                        return '✦';
                    }
                    return ch;
                }).join('');
            }).join(' ');
        }

        return maskNameEasy(name);
    }

    function setupHunterModePanel() {
        const btn = document.getElementById('hunterModeBtn');
        const panel = document.getElementById('hunterModePanel');
        const offBtn = document.getElementById('hunterOffBtn');
        const easyBtn = document.getElementById('levelEasyBtn');
        const hardBtn = document.getElementById('levelHardBtn');

        function refreshActiveStates() {
            offBtn.classList.toggle('active', !hunterModeOn);
            easyBtn.classList.toggle('active', hunterModeOn && hunterLevel === 'easy');
            hardBtn.classList.toggle('active', hunterModeOn && hunterLevel === 'hard');
            btn.classList.toggle('active', hunterModeOn);
        }

        btn.addEventListener('click', () => {
            panel.classList.toggle('open');
        });

        offBtn.addEventListener('click', () => {
            hunterModeOn = false;
            refreshActiveStates();
            panel.classList.remove('open');
            renderPlayersTable(currentPlayers);
        });

        easyBtn.addEventListener('click', () => {
            hunterModeOn = true;
            hunterLevel = 'easy';
            refreshActiveStates();
            panel.classList.remove('open');
            renderPlayersTable(currentPlayers);
        });

        hardBtn.addEventListener('click', () => {
            hunterModeOn = true;
            hunterLevel = 'hard';
            refreshActiveStates();
            panel.classList.remove('open');
            renderPlayersTable(currentPlayers);
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#hunterModeWrapper')) {
                panel.classList.remove('open');
            }
        });

        refreshActiveStates();
    }

    function seasonToYear(season) {
        if (!season || season === '-') return null;
        const digits = season.replace(/\D/g, '');
        if (digits.length >= 2) {
            const yearPrefix = parseInt(digits.substring(0, 2), 10);
            if (isNaN(yearPrefix)) return null;
            return yearPrefix >= 50 ? 1900 + yearPrefix : 2000 + yearPrefix;
        }
        return null;
    }

    function passesYearFilter(player) {
        if (!yearFilterActive || yearFilterValue === null) return true;

        const y1 = seasonToYear(player.season1);
        const y2 = seasonToYear(player.season2);
        const candidates = [y1, y2].filter(y => y !== null);

        if (candidates.length === 0) return false;

        if (yearFilterMode === 'before') {
            return candidates.every(y => y <= yearFilterValue);
        } else {
            return candidates.every(y => y >= yearFilterValue);
        }
    }

    function setupYearFilter() {
        const filterBtn = document.getElementById('yearFilterBtn');
        const panel = document.getElementById('yearFilterPanel');
        const input = document.getElementById('yearFilterInput');
        const modeSelect = document.getElementById('yearFilterModeSelect');

        filterBtn.addEventListener('click', () => {
            panel.classList.toggle('open');
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('yearFilterApplyBtn').click();
            }
        });

        document.getElementById('yearFilterApplyBtn').addEventListener('click', () => {
            const val = parseInt(input.value, 10);
            if (!isNaN(val)) {
                yearFilterActive = true;
                yearFilterValue = val;
                yearFilterMode = modeSelect.value;
                filterBtn.classList.add('active');
                renderPlayersTable(currentPlayers);
                panel.classList.remove('open');
            }
        });

        document.getElementById('yearFilterClearBtn').addEventListener('click', () => {
            yearFilterActive = false;
            yearFilterValue = null;
            input.value = '';
            filterBtn.classList.remove('active');
            renderPlayersTable(currentPlayers);
            panel.classList.remove('open');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.toolbar-wrapper')) {
                panel.classList.remove('open');
            }
        });
    }

    function renderPlayersTable(players) {
        const resultsTable = document.getElementById("resultsTable");
        resultsTable.innerHTML = "";

        const filtered = (players || []).filter(passesYearFilter);

        if (!filtered || filtered.length === 0) {
            resultsTable.innerHTML = "<tr><td colspan='6' style='text-align:center; padding:20px;'>Kriterlere uygun oyuncu bulunamadı.</td></tr>";
            return;
        }

        filtered.forEach(player => {
            const row = resultsTable.insertRow();

            let cleanName = (player.name || "-").replace(/\s*\(\d+\)\s*/g, "").trim();
            const nameCell = row.insertCell();
            nameCell.style.fontWeight = "600";

            if (hunterModeOn) {
                const masked = maskName(cleanName);
                const safeReal = cleanName.replace(/"/g, "&quot;");
                const safeMasked = masked.replace(/"/g, "&quot;");
                nameCell.innerHTML = `<div class="hunter-name-row"><span class="hunter-name" data-real="${safeReal}" data-masked="${safeMasked}">${masked}</span><button class="hunter-reveal-btn" title="Göster/Gizle">👁</button></div>`;
            } else {
                if (player.slug && player.playerId) {
                    const profileUrl = `https://www.transfermarkt.com/${player.slug}/profil/spieler/${player.playerId}`;
                    nameCell.innerHTML = `<a href="${profileUrl}" target="_blank" rel="noopener noreferrer" class="player-name-link">${cleanName}</a>`;
                } else {
                    nameCell.textContent = cleanName;
                }
            }

            const posCell = row.insertCell();
            posCell.textContent = player.position || "-";
            posCell.className = "badge-position";

            const natCell = row.insertCell();
            let rawNationality = (player.nationality || "-").trim();
            let firstNationality = rawNationality.split(/[\s,–-]+/)[0];
            const flag = getFlagEmoji(firstNationality);
            natCell.innerHTML = `<span class="badge-country">${flag ? flag + ' ' : ''}${firstNationality}</span>`;

            const dobCell = row.insertCell();
            dobCell.textContent = player.birthDate || "-";

            const s1Cell = row.insertCell();
            s1Cell.innerHTML = `<span class="badge-season">${player.season1 || "-"}</span>`;

            const s2Cell = row.insertCell();
            s2Cell.innerHTML = `<span class="badge-season">${player.season2 || "-"}</span>`;
        });

        if (hunterModeOn) {
            resultsTable.querySelectorAll('.hunter-reveal-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const span = btn.previousElementSibling;
                    const revealed = span.classList.toggle('revealed');
                    span.textContent = revealed ? span.dataset.real : span.dataset.masked;
                    btn.textContent = revealed ? '🙈' : '👁';
                });
            });
        }
    }

    async function searchPlayers() {
        const input1 = document.getElementById("club1Input").value.trim();
        const input2 = document.getElementById("club2Input").value.trim();
        const resultsTable = document.getElementById("resultsTable");
        const topLoader = document.getElementById("topLoader");

        if (!input1 && !input2) {
            resultsTable.innerHTML = "<tr><td colspan='6' style='text-align:center; padding:20px;'>Lütfen en az bir alan doldurunuz.</td></tr>";
            return;
        }

        topLoader.style.display = "flex";
        playSearchSound();

        try {
            let url = input1 && input2
                ? `/commonPlayers?club1=${encodeURIComponent(input1)}&club2=${encodeURIComponent(input2)}`
                : `/players?club=${encodeURIComponent(input1 || input2)}`;

            const response = await fetch(url);
            const players = await response.json();

            currentPlayers = players || [];
            renderPlayersTable(currentPlayers);

        } catch (error) {
            resultsTable.innerHTML = `<tr><td colspan='6' style='text-align:center; color:#ff8a80; padding:20px;'>Hata: ${error.message}</td></tr>`;
        } finally {
            topLoader.style.display = "none";
        }
    }

    document.getElementById("searchBtn").addEventListener("click", searchPlayers);

    window.onload = () => {
        applyQueryParamsToInputs();
        loadSuggestions();
        setupAutocomplete("club1Input", "club1Dropdown");
        setupAutocomplete("club2Input", "club2Dropdown");
        setupThemeSwitcher();
        setupHunterModePanel();
        setupYearFilter();
        setupShareButton();
        setupSoundToggle();
        setupUtilityMenu();
        setupLuckyMode();
        setupPlayerMode();
        setupHomeMenuButton();
        searchPlayers();
    };
</script>
